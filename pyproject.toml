[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-socio-wind-tunnel"
version = "0.5.0"
description = "AI multi-agent urban social simulation system for studying hyperlocal boundary penetration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mutmut", "psutil"]
llm = ["anthropic"]
web = ["flask"]
map-enrichment = ["overturemaps", "shapely"]
full = ["anthropic", "flask", "overturemaps", "shapely"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that take > 10s (deselect with '-m \"not slow\"'); typically e2e or profile harness",
]

[tool.mutmut]
# Mutation testing baseline — focused on hot paths added by
# harden-worker-resilience. Run: `python -m mutmut run`
# See docs/testing-philosophy.md Section 11.3 for interpretation.
paths_to_mutate = "synthetic_socio_wind_tunnel/conversation/dialogue_service.py"
tests_dir = "tests/"

[tool.setuptools.packages.find]
where = ["."]
